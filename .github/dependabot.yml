version: 2

updates:
  # GitHub Actions: keep workflow action pins reasonably current without noisy major jumps.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Budapest

    # One combined PR for all action minor/patch bumps (e.g. checkout, setup-node).
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

    # Major action releases often need workflow changes; review those manually.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

    # Cap open PRs so a backlog does not pile up on a low-traffic home project.
    open-pull-requests-limit: 2

  # npm/pnpm: root lockfile covers the whole workspace (apps + packages).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: Europe/Budapest

    # Single PR for routine dependency maintenance; CI (lint/test/build) validates it.
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

    # Framework majors (Next.js, etc.) can break builds; handle those deliberately.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

    open-pull-requests-limit: 2
