name: Docker Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  quality:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  publish-dashboard:
    permissions:
      contents: read
      packages: write
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/den-of-nodes-dashboard
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/dashboard/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-network-agent:
    permissions:
      contents: read
      packages: write
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/den-of-nodes-network-agent
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/network-agent/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-pi:
    permissions:
      contents: read
    environment: production
    needs: [publish-dashboard, publish-network-agent]
    if: |
      github.repository == 'desper8soul/den-of-nodes' &&
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.actor == 'desper8soul'
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest

      # Prove the runner actually joined the tailnet before attempting SSH.
      # A successful action step alone is not enough — check peers / ping.
      - name: Verify Tailscale + reach Pi
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
        run: |
          set -euo pipefail

          echo "== Runner identity =="
          tailscale status
          tailscale ip -4
          echo "Self tags / hostname:"
          tailscale status --json | python3 -c 'import json,sys; s=json.load(sys.stdin); self=s.get("Self",{}); print("HostName:", self.get("HostName")); print("Tags:", self.get("Tags")); print("Online:", self.get("Online")); print("TailscaleIPs:", self.get("TailscaleIPs"))'

          echo "== Looking for Pi peer (${PI_HOST}) =="
          if ! tailscale status | grep -Fi "$PI_HOST"; then
            echo "::error::Pi hostname not visible in tailscale status. Runner may be on a different tailnet, or MagicDNS name is wrong."
            echo "Peers:"
            tailscale status
            exit 1
          fi

          echo "== Ping Pi over Tailscale =="
          if ! tailscale ping -c 5 "$PI_HOST"; then
            echo "::error::tailscale ping failed. Runner is authenticated but cannot reach the Pi (ACL, Pi offline, or DERP/NAT issue)."
            exit 1
          fi

          echo "== TCP 22 =="
          for i in $(seq 1 15); do
            if timeout 3 bash -c "echo >/dev/tcp/${PI_HOST}/22" 2>/dev/null; then
              echo "Port 22 open"
              exit 0
            fi
            echo "Port 22 not open yet (${i}/15)"
            sleep 2
          done
          echo "::error::Pi is pingable over Tailscale but port 22 is closed from the runner."
          exit 1

      - name: Deploy on Pi
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
          PI_SSH_PRIVATE_KEY: ${{ secrets.PI_SSH_PRIVATE_KEY }}
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # Prefer the Tailscale IPv4 from status — avoids MagicDNS / IPv6 quirks
          # that sometimes break third-party SSH clients over the tailnet.
          PI_IP="$(tailscale status --json | python3 -c '
          import json, os, sys
          host = os.environ["PI_HOST"].lower().split(".")[0]
          status = json.load(sys.stdin)
          peers = list(status.get("Peer", {}).values())
          self = status.get("Self")
          if self:
              peers.append(self)
          for peer in peers:
              names = [
                  (peer.get("HostName") or "").lower(),
                  (peer.get("DNSName") or "").lower().rstrip("."),
              ]
              short = [n.split(".")[0] for n in names if n]
              if host in short or host in names or any(host in n for n in names):
                  ips = [ip for ip in peer.get("TailscaleIPs", []) if ":" not in ip]
                  if ips:
                      print(ips[0])
                      sys.exit(0)
          sys.exit("could not resolve PI_HOST to a Tailscale IPv4")
          ')"
          echo "Deploying via Tailscale IPv4: ${PI_IP}"

          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          # Preserve PEM newlines from the GitHub secret
          printf '%s\n' "$PI_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null

          ssh -vvv -4 \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o IPQoS=none \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=5 \
            -o ServerAliveCountMax=3 \
            "${PI_USER}@${PI_IP}" \
            "set -euo pipefail; cd ~/den-of-nodes; export GHCR_OWNER='${GHCR_OWNER}'; docker compose pull; docker compose up -d"
